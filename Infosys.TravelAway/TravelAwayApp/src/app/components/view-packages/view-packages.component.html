<div *ngIf="commonLayout">
  <app-common-layout></app-common-layout>
</div>
<div *ngIf="customerLayout">
  <app-user-layout></app-user-layout>
</div>

<div class="content">
  <h2 id="pkgheading">Packages</h2>

  <!-- Filter -->
  <div class="filter-row">
    <label for="ab"class="filter-label">Filter Packages:</label>
    <select class="form-control filter" id="ab"
            #categorydrop
            (change)="searchPackageByCategory(categorydrop.value)">
      <option value="0">All Categories</option>
      <option *ngFor="let category of categories"
              [value]="category.packageCategoryId">
        {{ category.packageCategoryName }}
      </option>
    </select>
  </div>

  <!-- Packages -->
  <div class="pkg-container">
    <div class="pkg-card"
         *ngFor="let package of filteredPackages">

      <img [src]="package.imageUrl"
           alt="Package"
           class="pkg-img" />

      <div class="pkg-info">
        <h3>{{ package.packageName }}</h3>
        <p>Explore this destination with us and create unforgettable memories.</p>

        <button class="pkg-btn"
                (click)="viewPackageDetails(package.packageId,package.packageName)">
          View Details
        </button>
      </div>

    </div>
  </div>
</div>
